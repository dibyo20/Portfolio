<svg
    xmlns="http://www.w3.org/2000/svg"
    width="128"
    height="128"
    viewBox="0 0 128 128"
    fill="none"
>
    <defs>
        <!-- Background -->
        <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128">
            <stop offset="0%" stop-color="#232533"/>
            <stop offset="100%" stop-color="#181A24"/>
        </linearGradient>

        <!-- Outer Border -->
        <linearGradient id="border" x1="0" y1="0" x2="0" y2="128">
            <stop offset="0%" stop-color="#52576A"/>
            <stop offset="100%" stop-color="#2E3241"/>
        </linearGradient>

        <!-- Soft Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow
                dx="0"
                dy="3"
                stdDeviation="6"
                flood-color="#000"
                flood-opacity="0.45"/>
        </filter>

        <!-- Inner Glow -->
        <radialGradient id="glow" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#353848"/>
            <stop offset="100%" stop-color="#1B1D27"/>
        </radialGradient>
    </defs>

    <!-- Outer Rounded Square -->
    <rect
        x="6"
        y="6"
        width="116"
        height="116"
        rx="28"
        fill="url(#bg)"
        stroke="url(#border)"
        stroke-width="3"
        filter="url(#shadow)"
    />

    <!-- Inner Panel -->
    <rect
        x="14"
        y="14"
        width="100"
        height="100"
        rx="22"
        fill="url(#glow)"
        opacity="0.95"
    />

    <!-- Highlight -->
    <rect
        x="8"
        y="8"
        width="112"
        height="112"
        rx="26"
        fill="none"
        stroke="rgba(255,255,255,0.08)"
        stroke-width="2"
    />

    <!-- Text -->
    <text
        x="64"
        y="78"
        text-anchor="middle"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="46"
        font-weight="800"
        fill="#FFFFFF"
    >
        DB
    </text>
</svg>